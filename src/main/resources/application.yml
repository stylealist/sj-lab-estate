server:
  # 다른 백엔드와 같게 포트는 0(임의) — 게이트웨이가 Eureka 에서 찾아 부른다.
  # 직접 확인하고 싶으면 --server.port=8120 으로 띄운다(local-stack.ps1 이 그렇게 띄운다).
  port: ${SERVER_PORT:0}
  servlet:
    context-path: /estate
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 2KB

spring:
  application:
    name: sj-lab-estate

estate:
  datasource:
    # 저장소가 public 이라 접속 정보는 환경변수로만 받는다. 로컬은 sj-lab 의
    # .claude/settings.local.json, 운영은 k8s Secret 에서 넣는다.
    # **값이 없으면 조회 API 만 503(NOT_CONFIGURED) 이고 /estate/status 는 그대로 응답한다** —
    # 화면이 "준비되지 않았다"를 사용자에게 알려 줄 수 있어야 하기 때문이다.
    url: ${ESTATE_DB_URL:}
    username: ${ESTATE_DB_USERNAME:}
    password: ${ESTATE_DB_PASSWORD:}
    # 5 로 두면 **무거운 집계(전국 평균·경계)가 풀을 다 쓰는 순간 핀 조회가 5초 만에
    # 타임아웃**해 화면에 "부동산 데이터를 조회하지 못했습니다"가 뜬다(2026-10-22 실측
    # estate-pool total=5 active=5). 조회 전용이라 넉넉히 둔다.
    pool-size: ${ESTATE_DB_POOL_SIZE:16}

  kakao:
    # 카카오톡 "나에게 보내기" — 목표가에 닿으면 알린다.
    # **저장소가 public 이라 키는 환경변수로만 받는다.** 값이 없으면 이 기능만 꺼지고
    # (화면이 연결 단추를 숨긴다) 나머지는 그대로 돈다.
    rest-api-key: ${KAKAO_REST_API_KEY:}
    # 카카오 개발자 화면에서 "보안 - Client Secret" 을 켰을 때만 필요하다(안 켰으면 비워 둔다).
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 동의 화면을 어떻게 띄울지. login = 세션이 있어도 로그인 화면을 다시 거친다(기본값).
    # select_account = 계정 고르기, 빈 값 = 카카오에 맡김(이미 동의했으면 곧바로 돌아온다).
    prompt: ${KAKAO_PROMPT:login}
    # 메시지의 단추가 열 주소. 로컬에서 시험할 때는 http://localhost:4200/ 로 바꾼다.
    site-url: ${KAKAO_SITE_URL:https://sj-lab.co.kr/estate/}
    # 감시 주기(ms). 기본 30분 — 수집이 끝나는 시각이 일정하지 않아 간격으로 훑는다.
    # 조건이 "연결한 사람 × 목표가를 정한 단지 × 아직 안 알린 도달" 이라 평소에는 행이 0개다.
    watch-interval-ms: ${KAKAO_WATCH_INTERVAL_MS:1800000}
    watch-initial-delay-ms: ${KAKAO_WATCH_INITIAL_DELAY_MS:60000}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: false
    # Map 으로 돌려줄 때 값이 null 인 컬럼도 키를 남긴다. 끄면 키가 아예 빠져
    # 화면이 "그 항목이 없는 응답"을 받게 된다.
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.sjlab.estate: info
